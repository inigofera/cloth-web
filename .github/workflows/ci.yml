name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Frontend build-time env (Vite inlines these into the bundle).
  # Placeholder values keep CI green without the secrets set; add the real
  # values as repo secrets (VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY,
  # VITE_SUPABASE_BUCKET) to keep builds reproducible.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-key' }}
  VITE_SUPABASE_BUCKET: ${{ secrets.VITE_SUPABASE_BUCKET || 'clothing-wardrobe' }}
  # Public API origin inlined into the Pages bundle (plan §1.1/§3.3): a plain
  # value, not a secret — the API carries no secrets in its URL.
  VITE_API_BASE_URL: https://api.inigoartolozaga.com

jobs:
  backend:
    runs-on: ubuntu-latest
    # Disposable database for the integration suite: it resets `public` and
    # `auth` and applies the whole migration chain, so it must be a throwaway
    # database that the tests own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        env:
          CLOTHWEB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cloth_test
        run: cargo test

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build (release)
        run: cargo build --release

      - name: Upload backend binary
        uses: actions/upload-artifact@v5
        with:
          name: backend
          path: target/release/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Dependency audit
        # Medium and below stay advisory; high/critical block the build.
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Guard bundle env
        # §8.4: a build with an empty/placeholder production env would ship a
        # dead app while CI stays green. When the real secrets are set, the
        # bundle must contain the real URL and not the placeholder.
        run: |
          if [ "$VITE_SUPABASE_URL" = "https://ci-placeholder.supabase.co" ]; then
            echo "::notice::CI placeholder VITE_SUPABASE_URL in use; bundle-env guard skipped"
            exit 0
          fi
          grep -rqF "$VITE_SUPABASE_URL" dist/assets \
            || { echo "::error::built bundle is missing $VITE_SUPABASE_URL"; exit 1; }
          if grep -rqF "ci-placeholder.supabase.co" dist/assets; then
            echo "::error::built bundle still contains the placeholder URL"
            exit 1
          fi
          echo "bundle contains the real VITE_SUPABASE_URL"

      - name: Upload frontend build
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

  image:
    # GHCR image for inibaby (plan §0.3/§1.5): the NUC never compiles Rust,
    # it just `docker pull`s. Runs on push to main only.
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # SHA tag = roll back to any past commit; `latest` = inibaby's
          # compose-file default.
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloth-web-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cloth-web-backend:latest
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build

  pages:
    # Frontend → GitHub Pages (plan §1.5). Rebuilds here instead of reusing
    # the frontend job's artifact (1.5a) to keep the jobs independent.
    # Requires repo Settings → Pages → Source: "GitHub Actions" first.
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # OIDC deployment — no deploy key to store
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        # VITE_API_BASE_URL (workflow env above) points the SPA at the
        # tunnel's public hostname; VITE_SUPABASE_* come from the same block.
        working-directory: frontend
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - uses: actions/deploy-pages@v4
        id: deploy

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke suite
        # Boots vite dev + the in-repo stub servers (see frontend/e2e/) and
        # drives the five critical flows: login, add item, log outfit,
        # insights render, settings save.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
